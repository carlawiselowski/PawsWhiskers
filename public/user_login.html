<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws & Whiskers - user</title>
    <link rel='stylesheet' type='text/css' media='screen' href='style_user_login.css'>
    <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Impede o envio padrão

      const username = form.username.value;
      const password = form.password.value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        window.location.href = '/main.html'; // Redireciona manualmente
      } else {
        const msg = await res.text();
        alert(msg); // Mostra erro
      }
    });
  </script>
</script>
</head>
<body>
    <div class="back">
        <button class="back" onclick="window.location.href='main.html'">
            <img class="carrinho" src="./img_geral/seta.png">
        </button>

    </div>
    <header>
            <h1 class="title"> Paws & Whiskers </h1>
    </header>
    <div class="all">
        <div class="container">
            <form class="login-form">

            <h2>Login</h2>

            <div class="input-group">
            <label for="username">username</label>
            <input type="text" id="username" placeholder="Type your username" required>
            </div>

            <div class="input-group">
            <label for="password">password</label>
            <input type="password" id="password" placeholder="Type your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
            <p class="signup"> doesn't have an account? <a href="sign_user.html">SIGN UP</a></p>
        
            <p class="signup"> <a href="admin.html">ADMIN</a></p>
    

            </form>
        </div>
    </div>
</body>
</html>
