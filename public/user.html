<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws & Whiskers - user</title>
    <link rel='stylesheet' type='text/css' media='screen' href='style_user.css'> 

</head>
<body>

    <header>
        <h1 class="title"> Paws & Whiskers </h1>
    </header>

    <div class="back">
        <button class="back" onclick="window.location.href='main.html'">
            <img class="carrinho" src="./img_geral/seta.png">
        </button>
    </div>

    <div class="all">
        <div class="container">
          
              <div class="menu-item">
                <div class="menu-header" onclick="toggleItem(this)">
                  <i class="icon">↓</i> Change Password
                </div>
                <div class="menu-content">
                update your current password to keep your account secure.

                    <div class="input-group">
                    <label for="password">current password</label>
                    <input type="password" id="password" placeholder="Type your current password" required>
                    </div>
        
                    <div class="input-group">
                    <label for=" confirm password">new password</label>
                    <input type="password" id="confirm_password" placeholder="Type your new password" required>
                    </div>

                    <button id="change-password-btn" class="login-btn">save</button>
            
                    </div>
              </div>
          
              <div class="menu-item">
                <div class="menu-header" onclick="toggleItem(this)">
                  <i class="icon">↓</i> Delete Account
                </div>
                <div class="menu-content">
                  permanently delete your account and all associated data.
                  <p>  </p>
                <button id="delete-account-btn" class="login-btn">delete</button>
                
            </div>
              </div>
        </div>
    </div>
  

       <script>
   function toggleItem(element) {
        const item = element.parentElement;
        item.classList.toggle("open");
      }


      const loggedIn = localStorage.getItem('loggedIn') === 'true';

      if (!loggedIn) {
        // Redireciona para login se não estiver logada
        window.location.href = 'user_login.html';
      }


      document.getElementById('change-password-btn').onclick = () => {
  const username = localStorage.getItem('username');
  const currentPassword = document.getElementById('password').value;
  const newPassword = document.getElementById('confirm_password').value;

  fetch('/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, currentPassword, newPassword })
  })
  .then(res => res.text())
  .then(alert)
  .catch(err => alert('Erro: ' + err));
};

document.getElementById('delete-account-btn').onclick = () => {
  const username = localStorage.getItem('username');
  const password = prompt('Digite sua senha para confirmar:');

  fetch('/delete-account', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  .then(res => res.text())
  .then(msg => {
    alert(msg);
    if (msg.includes('sucesso')) {
      localStorage.clear();
      window.location.href = 'user_login.html';
    }
  })
  .catch(err => alert('Erro: ' + err));
};
      </script>   
      
</body>

</html>
